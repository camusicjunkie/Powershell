name: Claude Code Review

# On Team/Enterprise plans you can use the managed "Code Review for Claude Code"
# (Quick / Standard / Deep) instead of this workflow.
# Needs a repository secret: ANTHROPIC_API_KEY (or switch to claude_code_oauth_token).
# Pin the action to a release tag or commit SHA you have checked.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the code reviewer for this pull request. Follow REVIEW.md and CLAUDE.md
            in the repo root. They override anything below if they conflict.

            Goal: find real bugs before they ship. Check that the change does what the PR
            description says, fits the rest of the system, and doesn't break other code.
            For a bug fix, check that it addresses the root cause.

            Rules:
            - Report only correctness, security and broken-contract issues. No style or cleanup.
            - Cite an exact path:line for every finding, and post it as an inline comment.
            - Mark each finding 🔴 Important, 🟡 Nit or 🟣 Pre-existing (bug in code this PR
              didn't change). List the most severe first.
            - Name the class of a bug and list every instance, so the author can fix them all at once.

            Convergence (read the earlier review comments on this PR first):
            - Never re-report a finding that was already raised, whether it is resolved or not.
            - If you have already reviewed this PR, review only the commits pushed since your
              last review.
            - If this is round 4 or later, don't file new nits. Post one summary comment that
              asks the author to rethink the approach if 🔴 issues keep coming back.

            Finish with one top-level comment (gh pr comment) giving the number of findings
            by severity, or saying clearly "No issues found."
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*)"
